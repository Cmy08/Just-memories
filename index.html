<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>📦 聊天存档 · 阅读编辑器</title>
    <!-- 使用 marked 和 JSZip 的 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #0f1117;
            color: #e4e6eb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }
        /* 主容器 */
        .app {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        /* 头部 */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: #1e2128;
            padding: 12px 18px;
            border-radius: 16px;
            border: 1px solid #2d313a;
        }
        .header h1 {
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 span {
            background: #2d313a;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 400;
            color: #9aa0b0;
        }
        .header-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .btn {
            background: #2d313a;
            border: none;
            color: #e4e6eb;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid transparent;
        }
        .btn:hover {
            background: #3d424d;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-primary {
            background: #4a6cf7;
            color: white;
            border-color: #4a6cf7;
        }
        .btn-primary:hover {
            background: #5f7cf8;
        }
        .btn-success {
            background: #2b8c5e;
            color: white;
            border-color: #2b8c5e;
        }
        .btn-success:hover {
            background: #36a06e;
        }
        .btn-warning {
            background: #b8860b;
            color: white;
            border-color: #b8860b;
        }
        .btn-warning:hover {
            background: #d49c14;
        }
        .btn-outline {
            background: transparent;
            border-color: #3d424d;
        }
        .btn-outline:hover {
            background: #2d313a;
        }
        /* 主布局：文件列表 + 内容 */
        .main-layout {
            display: flex;
            gap: 16px;
            flex: 1;
            min-height: 500px;
        }
        /* 文件侧栏 */
        .file-sidebar {
            width: 220px;
            flex-shrink: 0;
            background: #1a1d24;
            border-radius: 16px;
            border: 1px solid #2d313a;
            padding: 12px 0;
            max-height: 70vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .file-sidebar .sidebar-title {
            padding: 0 16px 10px 16px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #7a8296;
            border-bottom: 1px solid #2d313a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-list {
            list-style: none;
            padding: 8px 0;
            flex: 1;
        }
        .file-list li {
            padding: 8px 16px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: background 0.15s;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            word-break: break-word;
        }
        .file-list li:hover {
            background: #262b34;
        }
        .file-list li.active {
            background: #2d3340;
            border-left-color: #4a6cf7;
            color: #fff;
        }
        .file-list li .file-icon {
            opacity: 0.6;
            font-size: 1rem;
        }
        .file-list .empty-files {
            padding: 20px 16px;
            color: #5e667a;
            font-size: 0.9rem;
            text-align: center;
        }
        /* 内容区域 */
        .content-area {
            flex: 1;
            background: #1a1d24;
            border-radius: 16px;
            border: 1px solid #2d313a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 400px;
        }
        /* 内容头部：模式切换 + 文件名 */
        .content-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            border-bottom: 1px solid #2d313a;
            gap: 8px;
            background: #1e2128;
        }
        .content-header .file-name {
            font-weight: 500;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #c8ccd6;
        }
        .content-header .file-name .badge {
            font-size: 0.65rem;
            background: #2d313a;
            padding: 2px 10px;
            border-radius: 12px;
            color: #9aa0b0;
        }
        .mode-toggle {
            display: flex;
            gap: 4px;
            background: #262b34;
            border-radius: 30px;
            padding: 3px;
        }
        .mode-toggle .btn-mode {
            background: transparent;
            border: none;
            color: #8e96aa;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .mode-toggle .btn-mode.active {
            background: #3d424d;
            color: #fff;
        }
        .mode-toggle .btn-mode:hover:not(.active) {
            color: #d0d4e0;
        }
        /* 内容主体 */
        .content-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            background: #14171e;
            min-height: 300px;
        }
        .content-body .view-mode {
            line-height: 1.7;
            color: #e4e6eb;
        }
        .content-body .view-mode h1,
        .content-body .view-mode h2,
        .content-body .view-mode h3 {
            color: #f0f2f5;
            margin: 1.2em 0 0.6em;
        }
        .content-body .view-mode p {
            margin: 0.8em 0;
        }
        .content-body .view-mode blockquote {
            border-left: 4px solid #4a6cf7;
            padding-left: 16px;
            margin: 12px 0;
            color: #b0b8cc;
            background: #1e2128;
            padding: 10px 16px;
            border-radius: 8px;
        }
        .content-body .view-mode pre {
            background: #0d0f14;
            padding: 14px;
            border-radius: 10px;
            overflow-x: auto;
            border: 1px solid #2d313a;
            font-size: 0.85rem;
        }
        .content-body .view-mode code {
            font-family: 'JetBrains Mono', monospace;
            background: #1e2128;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        .content-body .view-mode table {
            border-collapse: collapse;
            width: 100%;
            margin: 12px 0;
        }
        .content-body .view-mode th,
        .content-body .view-mode td {
            border: 1px solid #2d313a;
            padding: 8px 12px;
            text-align: left;
        }
        .content-body .view-mode th {
            background: #1e2128;
        }
        /* 自定义美化：对话气泡、卡片、折叠面板 */
        .content-body .view-mode .H {
            background: #1e2128;
            border-radius: 12px;
            padding: 14px 18px;
            margin: 16px 0;
            border-left: 4px solid #4a6cf7;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 20px;
        }
        .content-body .view-mode .H .h {
            display: flex;
            gap: 6px;
            font-size: 0.9rem;
        }
        .content-body .view-mode .H .h .L {
            color: #7a8296;
            font-weight: 500;
            min-width: 44px;
        }
        .content-body .view-mode .H .h .V {
            color: #d0d4e0;
        }
        .content-body .view-mode .H .h .V.A {
            color: #f77a7a;
            font-weight: 600;
        }
        .content-body .view-mode .P {
            background: #1e2128;
            border-radius: 12px 12px 12px 4px;
            padding: 10px 16px;
            margin: 8px 0 8px 12px;
            border-left: 3px solid #4a6cf7;
            color: #d0d4e0;
            display: inline-block;
            max-width: 90%;
        }
        .content-body .view-mode .B {
            background: #1a1d24;
            border-radius: 12px;
            padding: 8px 0;
            margin: 16px 0;
            border: 1px solid #2d313a;
        }
        .content-body .view-mode .B .T {
            padding: 8px 16px;
            font-size: 0.8rem;
            color: #7a8296;
            border-bottom: 1px solid #2d313a;
        }
        .content-body .view-mode details.D {
            background: #14171e;
            border-radius: 8px;
            margin: 4px 8px;
            border: 1px solid #262b34;
        }
        .content-body .view-mode details.D summary.S {
            padding: 8px 14px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            list-style: none;
            border-radius: 8px;
            transition: background 0.15s;
        }
        .content-body .view-mode details.D summary.S:hover {
            background: #1e2128;
        }
        .content-body .view-mode details.D summary.S::-webkit-details-marker {
            display: none;
        }
        .content-body .view-mode details.D .c {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .content-body .view-mode details.D .c .n {
            font-weight: 600;
            color: #f0f2f5;
        }
        .content-body .view-mode details.D .c .r {
            font-size: 0.7rem;
            color: #7a8296;
            background: #262b34;
            padding: 2px 10px;
            border-radius: 12px;
        }
        .content-body .view-mode details.D .C {
            padding: 10px 14px 14px 14px;
            border-top: 1px solid #262b34;
            font-size: 0.9rem;
        }
        .content-body .view-mode details.D .C .R {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            background: #1a1d24;
            padding: 8px 12px;
            border-radius: 8px;
        }
        .content-body .view-mode details.D .C .R .k {
            color: #7a8296;
            font-weight: 500;
        }
        .content-body .view-mode details.D .C .R .v {
            color: #d0d4e0;
        }
        .content-body .view-mode details.D .C .G {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 16px;
            margin: 6px 0;
        }
        .content-body .view-mode details.D .C .G .i {
            display: flex;
            gap: 6px;
            border-left: 3px solid #4a6cf7;
            padding-left: 10px;
            font-size: 0.85rem;
        }
        .content-body .view-mode details.D .C .G .i .gl {
            color: #7a8296;
            font-weight: 500;
            min-width: 40px;
        }
        .content-body .view-mode details.D .C .G .i .gv {
            color: #d0d4e0;
        }
        .content-body .view-mode details.D .C .O {
            margin-top: 8px;
            background: #11141b;
            border-radius: 8px;
            padding: 8px 12px;
        }
        .content-body .view-mode details.D .C .O .o {
            display: flex;
            gap: 12px;
            font-size: 0.85rem;
            padding: 2px 0;
            border-bottom: 1px solid #1e2128;
        }
        .content-body .view-mode details.D .C .O .o .ot {
            color: #7a8296;
            font-weight: 500;
            min-width: 70px;
        }
        .content-body .view-mode details.D .C .O .o .od {
            color: #c8ccd6;
        }
        .content-body .view-mode .tx {
            padding: 4px 12px;
            font-size: 0.85rem;
            border-left: 2px solid #4a6cf7;
            margin: 4px 0;
            background: #1a1d24;
            border-radius: 4px;
        }
        .content-body .view-mode .tx.cmd {
            border-left-color: #b8860b;
        }
        .content-body .view-mode .tx.sys {
            border-left-color: #2b8c5e;
        }
        .content-body .view-mode .tx strong {
            color: #f0f2f5;
        }
        /* 编辑模式 */
        .content-body .edit-mode textarea {
            width: 100%;
            height: 100%;
            min-height: 400px;
            background: #0d0f14;
            border: 1px solid #2d313a;
            border-radius: 10px;
            color: #d0d4e0;
            padding: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.7;
            resize: vertical;
            outline: none;
        }
        .content-body .edit-mode textarea:focus {
            border-color: #4a6cf7;
        }
        /* 空状态 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 300px;
            color: #5e667a;
            text-align: center;
            gap: 12px;
        }
        .empty-state .icon {
            font-size: 3rem;
            opacity: 0.5;
        }
        .empty-state .hint {
            font-size: 0.9rem;
            max-width: 360px;
        }
        /* 上传区域（拖拽） */
        .drop-zone {
            border: 2px dashed #2d313a;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s, background 0.3s;
            background: #14171e;
            margin-bottom: 4px;
        }
        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: #4a6cf7;
            background: #1a1d28;
        }
        .drop-zone .upload-icon {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }
        .drop-zone .upload-text {
            font-size: 0.95rem;
            color: #9aa0b0;
        }
        .drop-zone .upload-hint {
            font-size: 0.8rem;
            color: #5e667a;
            margin-top: 6px;
        }
        /* 响应式 */
        @media (max-width: 768px) {
            .main-layout {
                flex-direction: column;
            }
            .file-sidebar {
                width: 100%;
                max-height: 200px;
                flex-shrink: 0;
            }
            .content-header {
                flex-direction: column;
                align-items: stretch;
            }
            .content-body .view-mode .H {
                grid-template-columns: 1fr;
            }
            .content-body .view-mode details.D .C .G {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .header-actions {
                justify-content: stretch;
            }
            .header-actions .btn {
                flex: 1;
                justify-content: center;
            }
        }
        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #14171e;
        }
        ::-webkit-scrollbar-thumb {
            background: #3d424d;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #5a6178;
        }
        /* 小提示 */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #2d313a;
            color: #e4e6eb;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 0.9rem;
            border: 1px solid #3d424d;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            max-width: 90%;
        }
        .toast.show {
            opacity: 1;
        }
        .file-count {
            font-size: 0.75rem;
            color: #7a8296;
            padding: 0 16px 8px 16px;
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <!-- 头部 -->
        <header class="header">
            <h1>
                📦 聊天存档·阅读器
                <span>v1.0</span>
            </h1>
            <div class="header-actions">
                <button class="btn btn-primary" id="uploadBtn">📤 上传压缩包</button>
                <button class="btn btn-success" id="exportBtn" disabled>💾 导出压缩包</button>
                <button class="btn btn-outline" id="resetBtn">🔄 重置</button>
            </div>
        </header>

        <!-- 主布局 -->
        <div class="main-layout">
            <!-- 文件列表 -->
            <aside class="file-sidebar" id="fileSidebar">
                <div class="sidebar-title">
                    <span>📄 文件列表</span>
                    <span id="fileCount" class="file-count">0 个</span>
                </div>
                <ul class="file-list" id="fileList">
                    <li class="empty-files">暂无文件，请上传压缩包</li>
                </ul>
            </aside>

            <!-- 内容 -->
            <section class="content-area">
                <div class="content-header">
                    <div class="file-name" id="currentFileName">
                        <span>📄</span>
                        <span id="fileNameDisplay">未选择文件</span>
                        <span class="badge" id="fileStatusBadge">查看</span>
                    </div>
                    <div class="mode-toggle">
                        <button class="btn-mode active" data-mode="view">👁️ 查看</button>
                        <button class="btn-mode" data-mode="edit">✏️ 编辑</button>
                    </div>
                </div>
                <div class="content-body" id="contentBody">
                    <div class="empty-state">
                        <div class="icon">📂</div>
                        <div class="hint">上传一个包含 .md 文件的压缩包，<br>即可开始阅读和编辑。</div>
                    </div>
                </div>
            </section>
        </div>

        <!-- 上传按钮隐藏，通过JS触发 -->
        <input type="file" id="fileInput" accept=".zip" style="display:none;">

        <!-- Toast 提示 -->
        <div class="toast" id="toast"></div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- 状态 ----------
            const state = {
                zipData: null,           // 原始 ZIP 数据 (ArrayBuffer)
                files: [],               // 文件列表 [{ name, content }]
                currentFileIndex: 0,
                currentMode: 'view',     // 'view' | 'edit'
                editContent: {},         // 编辑暂存 { filename: content }
                hasChanges: false,
                zipFileName: 'archive.zip'
            };

            // DOM 引用
            const fileListEl = document.getElementById('fileList');
            const fileCountEl = document.getElementById('fileCount');
            const fileNameDisplay = document.getElementById('fileNameDisplay');
            const fileStatusBadge = document.getElementById('fileStatusBadge');
            const contentBody = document.getElementById('contentBody');
            const fileInput = document.getElementById('fileInput');
            const uploadBtn = document.getElementById('uploadBtn');
            const exportBtn = document.getElementById('exportBtn');
            const resetBtn = document.getElementById('resetBtn');
            const toastEl = document.getElementById('toast');

            // ---------- 辅助 ----------
            function showToast(msg, duration = 2500) {
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                clearTimeout(toastEl._timer);
                toastEl._timer = setTimeout(() => {
                    toastEl.classList.remove('show');
                }, duration);
            }

            // 从 localStorage 恢复
            function loadFromStorage() {
                try {
                    const saved = localStorage.getItem('chatArchiveEditorState');
                    if (!saved) return false;
                    const data = JSON.parse(saved);
                    if (!data.files || data.files.length === 0) return false;
                    state.files = data.files;
                    state.editContent = data.editContent || {};
                    state.currentFileIndex = data.currentFileIndex || 0;
                    state.zipFileName = data.zipFileName || 'archive.zip';
                    // 确保 currentFileIndex 有效
                    if (state.currentFileIndex >= state.files.length) state.currentFileIndex = 0;
                    return true;
                } catch (e) {
                    console.warn('读取存储失败', e);
                    return false;
                }
            }

            function saveToStorage() {
                try {
                    const data = {
                        files: state.files,
                        editContent: state.editContent,
                        currentFileIndex: state.currentFileIndex,
                        zipFileName: state.zipFileName
                    };
                    localStorage.setItem('chatArchiveEditorState', JSON.stringify(data));
                } catch (e) {
                    console.warn('保存存储失败', e);
                }
            }

            // 获取当前文件内容（优先编辑暂存）
            function getCurrentFileContent() {
                if (!state.files.length) return '';
                const f = state.files[state.currentFileIndex];
                if (!f) return '';
                const key = f.name;
                if (state.editContent[key] !== undefined) {
                    return state.editContent[key];
                }
                return f.content || '';
            }

            function setCurrentFileContent(content) {
                if (!state.files.length) return;
                const f = state.files[state.currentFileIndex];
                if (!f) return;
                const key = f.name;
                state.editContent[key] = content;
                state.hasChanges = true;
                saveToStorage();
                renderFileList();
                updateFileStatusBadge();
            }

            // ---------- 渲染文件列表 ----------
            function renderFileList() {
                if (!state.files.length) {
                    fileListEl.innerHTML = `<li class="empty-files">暂无文件，请上传压缩包</li>`;
                    fileCountEl.textContent = '0 个';
                    exportBtn.disabled = true;
                    return;
                }
                exportBtn.disabled = false;
                fileCountEl.textContent = `${state.files.length} 个`;
                const html = state.files.map((f, idx) => {
                    const active = idx === state.currentFileIndex ? 'active' : '';
                    const icon = f.name.endsWith('.md') ? '📝' : '📄';
                    return `<li class="${active}" data-index="${idx}">
                                <span class="file-icon">${icon}</span>
                                ${f.name}

                fileListEl.querySelectorAll('li').forEach(li => {

                        const idx = parseInt(this.dataset.index, 10);
                        if (!isNaN(idx) && idx !== state.currentFileIndex) {
                            // 保存当前编辑内容
                            if (state.currentMode === 'edit') {
                                const textarea = contentBody.querySelector('.edit-mode textarea');
                                if (textarea) {
                                    setCurrentFileContent(textarea.value);
                                }
                            }
                            state.currentFileIndex = idx;

            function updateFileStatusBadge() {

                if (!f) return;
                const key = f.name;
                const hasEdit = state.editContent[key] !== undefined;
                fileStatusBadge.textContent = hasEdit ? '✏️ 已编辑' : '📄 原始';
            }

            // ---------- 渲染内容 ----------

                        </div>
                    `;
                    fileNameDisplay.textContent = '未选择文件';

                const f = state.files[state.currentFileIndex];

                        <div class="edit-mode">
                            <textarea id="editTextarea">${escapeHtml(content || '')}</textarea>
                        </div>
                    `;
                    const textarea = document.getElementById('editTextarea');
                    if (textarea) {
                        textarea.addEventListener('input', function() {
                            setCurrentFileContent(this.value);

                        textarea.addEventListener('blur', function() {
                            setCurrentFileContent(this.value);
                        });
                    }
                }
            }

            // 简单转义 HTML 用于 textarea

                return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            function setMode(mode) {
                if (state.currentMode === mode) return;

                    if (textarea) {
                        setCurrentFileContent(textarea.value);

                // 更新按钮样式
                document.querySelectorAll('.btn-mode').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.mode === mode);
                });
                renderContent();
                // 更新状态
                saveToStorage();
            }
